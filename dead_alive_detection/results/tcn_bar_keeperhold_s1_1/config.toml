# Resolved config (every option, no extends): written by the run.
name = "tcn_bar_keeperhold_s1"

[data]
test_match = "DFL-MAT-J03WR9"
folds = []
datasets = ["dfl"]

[runtime]
threads = 10
processes = 10
cache = "cache/dead_alive_dfl"

[features]
walking_speed = 1.0
touchline_m = 3.0
ball = true
collective = true
last_seen = true
formation = false
ball_exit = false
feature_set = "v1"
whistle = true
tracked = true
keeper = true
speed_cap = 10.0
accel_cap = 10.0
bump_s = 2.5
bump_mps = 3.25

[augment.train]
recipe = "bar_motion_whistle_crowd_keeper_train"
hidden_fracs = [0.0, 0.25, 0.41, 0.6, 0.8, 1.0]

[augment.eval]
conditions = ["bar_motion", "bar_motion_whistle", "bar_motion_whistle_crowd", "clean", "bar_motion_keeper", "bar_motion_whistle_keeper"]
primary = "bar_motion_whistle"

[augment.recipes.clean]

[augment.recipes.bar_ball]
ball = "hidden"

[augment.recipes.bar_ball_players]
players = "fragments"
ball = "hidden"

[augment.recipes.bar_moving]
players = "fragments"
dead_ball = "uniform"
ball = "hidden"

[augment.recipes.bar_motion]
players = "fragments"
dead_ball = "bar"
ball = "hidden"

[augment.recipes.bar_learned]
players = "learned"
dead_ball = "bar"
ball = "hidden"

[augment.recipes.bar_motion_whistle_train]
players = "fragments"
dead_ball = "bar"
ball = "hidden"
whistle = "train"

[augment.recipes.bar_motion_whistle]
players = "fragments"
dead_ball = "bar"
ball = "hidden"
whistle = "bar"

[augment.recipes.bar_motion_whistle_low]
players = "fragments"
dead_ball = "bar"
ball = "hidden"
whistle = "low"

[augment.recipes.bar_motion_whistle_high]
players = "fragments"
dead_ball = "bar"
ball = "hidden"
whistle = "high"

[augment.recipes.bar_motion_whistle_crowd_train]
players = "learned"
dead_ball = "bar"
ball = "hidden"
whistle = "train"

[augment.recipes.bar_motion_whistle_crowd]
players = "learned"
dead_ball = "bar"
ball = "hidden"
whistle = "bar"

[augment.recipes.bar_motion_whistle_crowd_keeper_train]
players = "learned"
dead_ball = "bar"
ball = "hidden"
whistle = "train"
keeper = "hide"

[augment.recipes.bar_motion_keeper]
players = "fragments"
dead_ball = "bar"
ball = "hidden"
keeper = "hide"

[augment.recipes.bar_motion_whistle_keeper]
players = "fragments"
dead_ball = "bar"
ball = "hidden"
whistle = "bar"
keeper = "hide"

[augment.players.fragments]
seed = 7
profile = "data/processed/noise_profile.json"
duplicates = true
duplicate_max_s = 30.0
duplicate_offset_m = [0.3, 2.0]
n_draws = 20000
bisection_steps = 12

[augment.players.learned]
seed = 10
model = "cache/players_learned/BAR-ATH.json"
bisection_steps = 8
duplicates = true
duplicate_max_s = 30.0
duplicate_offset_m = [0.3, 2.0]
n_draws = 20000
duplicate_bisection_steps = 12
crowd_scale = 1.5

[augment.swaps]
seed = 12
model = "cache/player_swaps/BAR-ATH.json"
dead_share = 0.5
rate_scale = 1.0

[augment.ball]
seed = 0
model = "cache/ball_loss/BAR-ATH.json"

[augment.keeper]
seed = 13
prob = 0.8
lead_s = [0.0, 0.6]
tail_s = [0.0, 6.0]

[augment.whistle]
seed = 11
start_offset_s = [-0.2, 0.5, 1.5]
restart_lead_s = [0.3, 2.5]

[augment.whistle.start]
whistle = 0.95
incident = 0.9
goal = 0.5
throw_in = 0.05
goal_kick = 0.05
corner = 0.05
other = 0.3

[augment.whistle.restart]
whistle = 0.3
incident = 0.6
goal = 1.0
throw_in = 0.05
goal_kick = 0.05
corner = 0.05
other = 0.2

[augment.whistle.profiles.train]
recall = [0.1, 0.8]
false_per_min = [0.0, 0.25]

[augment.whistle.profiles.bar]
recall = [0.5, 0.5]
false_per_min = [0.15, 0.15]

[augment.whistle.profiles.low]
recall = [0.25, 0.25]
false_per_min = [0.2, 0.2]

[augment.whistle.profiles.high]
recall = [0.8, 0.8]
false_per_min = [0.05, 0.05]

[augment.dead_ball.uniform]
seed = 8
target_speed = 2.7
smooth_s = 1.0
margin_m = 3.0

[augment.dead_ball.bar]
seed = 9
scale_range = [0.75, 1.3]
margin_m = 3.0
library = "cache/dead_alive_dfl/bar_motion/library_old_voters.npz"
voters = ["hsmm", "tcn_last_seen", "tcn_moving"]
min_votes = 2
min_stretch_s = 2.0
phase_s = 2.0
max_step_m = 1.2

[augment.dead_ball.bar.piece_s]
start = 1.0
middle = 3.0
end = 1.0

[model]
channels = 64
kernel = 3
dilations = [1, 2, 4, 8, 16, 32, 64, 128]
dropout = 0.1

[train]
epochs = 40
batch_size = 32
window_s = 120.0
learning_rate = 0.001
weight_decay = 0.0001
boundary_weight = 0.5
boundary_sigma_s = 0.4
seed = 1
log_every = 5

[types]
classes = ["whistle", "throw_in", "goal_kick", "corner", "goal", "incident", "other"]
weight = 0.1
seed = 1

[decoding]
temperature = 0.25
bandwidth = 0.25
dead_max_s = 300.0
alive_max_s = 600.0
w_start = 0.5
w_stop = 2.0

[decoding.typed]
enabled = false
type_weight = 1.0
evidence = "mean"

[decoding.grid]
enabled = false
temperatures = [0.25, 0.5, 0.75, 1.0]
w_start = [0.0, 0.5, 1.0, 2.0]
w_stop = [0.0, 0.5, 1.0, 2.0]
extra = [[0.1, 2.0, 0.0], [0.1, 2.0, 0.5], [0.1, 2.0, 1.0], [0.1, 3.0, 0.0], [0.1, 3.0, 0.5], [0.1, 3.0, 1.0], [0.1, 4.0, 0.0], [0.1, 4.0, 0.5], [0.1, 4.0, 1.0], [0.15, 2.0, 0.0], [0.15, 2.0, 0.5], [0.15, 2.0, 1.0], [0.15, 3.0, 0.0], [0.15, 3.0, 0.5], [0.15, 3.0, 1.0], [0.15, 4.0, 0.0], [0.15, 4.0, 0.5], [0.15, 4.0, 1.0], [0.25, 2.0, 0.0], [0.25, 2.0, 0.5], [0.25, 2.0, 1.0], [0.25, 3.0, 0.0], [0.25, 3.0, 0.5], [0.25, 3.0, 1.0], [0.25, 4.0, 0.0], [0.25, 4.0, 0.5], [0.25, 4.0, 1.0]]
type_weights = [1.0]
type_evidence = ["mean"]
conditions = ["bar_motion"]
select_metric = "spell_f1_ctrl"
select_condition = "bar_motion"

[bar]
enabled = false
train = "dev"
match = "data/processed/BAR-ATH.parquet"
name = "tcn_bar_keeperhold_s1"
decoder = "config"
teams = "evaluation/results/baseline_smooth50.csv"
whistles = "cache/audio/BAR-ATH_broadcast_whistles_preset.csv"
