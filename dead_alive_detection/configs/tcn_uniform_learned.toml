# Players lost where BAR-ATH's are (learned), made-up dead-ball motion (no BAR library needed).
# Compare with tcn_uniform_fragments.toml: only the players differ, and both score both conditions.
extends = "tcn_bar.toml"

[augment.recipes.learned_uniform]
players = "learned"
dead_ball = "uniform"
ball = "hidden"

[augment.train]
recipe = "learned_uniform"

[augment.eval]
conditions = ["learned_uniform", "bar_moving", "clean"]
primary = "learned_uniform"

[augment.players.fragments]
profile = "cache/players_learned/BAR-ATH.json"   # the same BAR-ATH aggregates for both kinds

[decoding.grid]
conditions = ["learned_uniform"]
select_condition = "learned_uniform"
